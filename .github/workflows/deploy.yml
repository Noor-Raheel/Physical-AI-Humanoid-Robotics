name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Debug: List files and PWD
        run: |
          pwd
          ls -la
          ls -la docusaurus-site/
      # 👇 Build steps
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          # Removed cache: 'npm' and cache-dependency-path
      - name: Install dependencies and Build
        run: |
          cd docusaurus-site
          npm ci
          npm run build
      # 👆 Build steps
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 👇 Specify build output path
          path: docusaurus-site/build # Path relative to repo root
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4