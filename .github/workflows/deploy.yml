name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults: # Set default working directory for all run steps in this job
      run:
        working-directory: docusaurus-site
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      # 👇 Build steps
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: package-lock.json # Now relative to docusaurus-site
      - name: Install dependencies
        run: npm ci # This will run in docusaurus-site
      - name: Build
        run: npm run build # This will run in docusaurus-site
      # 👆 Build steps
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 👇 Specify build output path
          path: build # Now relative to docusaurus-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4